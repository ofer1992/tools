<html>

<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.2/p5.js"></script>

</head>

<body>
    <div id="params">
        <div>
            <label for="phase">Phase</label>
            <input type="range" id="phase" name="phase" min="0" max="359" value="0">
        </div>
        <div>
            <label for="freq">Frequency Ratio</label>
            <input type="range" id="vfreq" name="vfreq" min="1" max="10" value="1">
            <input type="range" id="hfreq" name="hfreq" min="1" max="10" value="1">
        </div>
    </div>


    <script>
        const sep = 20;
        let phase = 0;

        let VcircleX = 100;
        let VcircleY = 150;
        let VcircleRadius = 75;
        let Vfreq = 1;

        let HcircleRadius = VcircleRadius * 2;
        let HcircleX = VcircleX + VcircleRadius + HcircleRadius + sep;
        let HcircleY = VcircleY + VcircleRadius + HcircleRadius + sep;
        let Hfreq = 1;

        let rectX = VcircleX + VcircleRadius + sep;
        let rectY = VcircleY - VcircleRadius;
        let rectW = HcircleRadius * 2;
        let rectH = VcircleRadius * 2;

        let graphX = 150;
        let graphY = 650;
        let graphAmplitude = 50;
        let graphPeriod = 300;

        document.getElementById("phase").oninput = (event) => { phase = Number.parseInt(event.target.value) };
        document.getElementById("vfreq").oninput = (event) => { Vfreq = Number.parseInt(event.target.value) };
        document.getElementById("hfreq").oninput = (event) => { Hfreq = Number.parseInt(event.target.value) };

        function setup() {
            createCanvas(600, 800);
            angleMode(DEGREES);
            describe(
                'Animated demonstration of a point moving around the unit circle, together with the corresponding sine and cosine values moving along their graphs.'
            );
        }

        function draw() {
            background(0);

            // Set angle based on frameCount, and display current value

            let angle = frameCount / Math.max(Hfreq, Vfreq) % 360;

            fill(255);
            textSize(20);
            textAlign(LEFT, CENTER);
            text(`angle: ${Math.floor(angle)}`, 25, 25);

            // Draw bounding rectangle
            noFill();
            stroke(128);
            strokeWeight(3);
            rect(rectX, rectY, rectW, rectH);


            // Draw circle and diameters

            noFill();
            stroke(128);
            strokeWeight(3);
            circle(VcircleX, VcircleY, 2 * VcircleRadius);
            line(VcircleX, VcircleY - VcircleRadius, VcircleX, VcircleY + VcircleRadius);
            line(VcircleX - VcircleRadius, VcircleY, VcircleX + VcircleRadius, VcircleY);

            noFill();
            stroke(128);
            strokeWeight(3);
            circle(HcircleX, HcircleY, 2 * HcircleRadius);
            line(HcircleX, HcircleY - HcircleRadius, HcircleX, HcircleY + HcircleRadius);
            line(HcircleX - HcircleRadius, HcircleY, HcircleX + HcircleRadius, HcircleY);

            // Draw moving points

            // Vertical
            let VpointX = VcircleX + VcircleRadius * cos(Vfreq * angle);
            let VpointY = VcircleY - VcircleRadius * sin(Vfreq * angle);

            stroke(128);
            strokeWeight(3);
            line(VcircleX, VcircleY, VpointX, VpointY);

            noStroke();

            fill('white');
            circle(VpointX, VpointY, 10);

            // Horizontal
            let HpointX = HcircleX + HcircleRadius * cos(Hfreq * angle + phase);
            let HpointY = HcircleY - HcircleRadius * sin(Hfreq * angle + phase);

            stroke(128);
            strokeWeight(3);
            line(HcircleX, HcircleY, HpointX, HpointY);

            noStroke();

            fill('white');
            circle(HpointX, HpointY, 10);

            // Draw Lissajous curve

            noFill();
            stroke('white');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = HcircleX + HcircleRadius * cos(Hfreq * t + phase);
                let y = VcircleY - VcircleRadius * sin(Vfreq * t);
                vertex(x, y);
            }
            endShape();

            // Combined
            noStroke();

            fill('white');
            circle(HpointX, VpointY, 10);

            // Draw graph

            stroke('grey');
            strokeWeight(3);
            line(graphX, graphY, graphX + 300, graphY);
            line(graphX, graphY - graphAmplitude, graphX, graphY + graphAmplitude);
            line(
                graphX + graphPeriod,
                graphY - graphAmplitude,
                graphX + graphPeriod,
                graphY + graphAmplitude
            );

            fill('grey');
            strokeWeight(1);
            textAlign(CENTER, CENTER);
            text('0', graphX, graphY + graphAmplitude + 20);
            text('360', graphX + graphPeriod, graphY + graphAmplitude + 20);
            text('1', graphX / 2, graphY - graphAmplitude);
            text('0', graphX / 2, graphY);
            text('-1', graphX / 2, graphY + graphAmplitude);

            fill('orange');
            text('H', graphX + graphPeriod + graphX / 2, graphY - graphAmplitude);
            fill('red');
            text('V', graphX + graphPeriod + graphX / 2, graphY);
            fill('green');
            text('Combined', graphX + graphPeriod + graphX / 2, graphY + graphAmplitude);

            // Draw horizontal curve

            noFill();
            stroke('orange');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                let y = graphY - graphAmplitude * cos(Hfreq * t + phase);
                vertex(x, y);
            }
            endShape();

            // Draw vertical curve

            noFill();
            stroke('red');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                let y = graphY - graphAmplitude * sin(Vfreq * t) / 2;
                vertex(x, y);
            }
            endShape();

            // Draw combined curve

            noFill();
            stroke('green');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                let y = graphY - graphAmplitude * sin(Vfreq * t) / 2 - graphAmplitude * cos(Hfreq * t + phase);
                vertex(x, y);
            }
            endShape();

            /**
            // Draw moving line

            let lineX = map(angle, 0, 360, graphX, graphX + graphPeriod);
            stroke('grey');
            line(lineX, graphY - graphAmplitude, lineX, graphY + graphAmplitude);

            // Draw moving points on graph

            let orangeY = graphY - graphAmplitude * cos(angle);
            let redY = graphY - graphAmplitude * sin(angle);

            noStroke();

            fill('orange');
            circle(lineX, orangeY, 10);

            fill('red');
            circle(lineX, redY, 10);
            */
        }
    </script>
</body>

</html>
