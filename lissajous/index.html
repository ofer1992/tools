<html>

<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.2/p5.js"></script>

</head>

<body>
    <script>
        const sep = 20;

        const VcircleX = 100;
        const VcircleY = 150;
        const VcircleRadius = 75;

        const HcircleRadius = VcircleRadius * 2;
        const HcircleX = VcircleX + VcircleRadius + HcircleRadius + sep;
        const HcircleY = VcircleY + VcircleRadius + HcircleRadius + sep;

        const rectX = VcircleX + VcircleRadius + sep;
        const rectY = VcircleY - VcircleRadius;
        const rectW = HcircleRadius * 2;
        const rectH = VcircleRadius * 2;

        const graphX = 150;
        const graphY = 650;
        const graphAmplitude = 50;
        const graphPeriod = 300;

        const SliderX = 20;
        const sliderVoffset = 40;
        const phaseSliderY = VcircleY + VcircleRadius * 2;
        const hfreqSliderY = VcircleY + VcircleRadius * 2 + sliderVoffset;
        const vfreqSliderY = VcircleY + VcircleRadius * 2 + 2 * sliderVoffset;

        function setup() {
            createCanvas(600, 800);
            angleMode(DEGREES);
            describe(
                'Animated demonstration of a point moving around the unit circle, together with the corresponding sine and cosine values moving along their graphs.'
            );
            phaseSlider = createSlider(0, 359, 0);
            phaseSlider.position(SliderX, phaseSliderY);
            phaseSlider.size(80);

            hfreqSlider = createSlider(1, 10, 1);
            hfreqSlider.position(SliderX, hfreqSliderY);
            hfreqSlider.size(80);

            vfreqSlider = createSlider(1, 10, 1);
            vfreqSlider.position(SliderX, vfreqSliderY);
            vfreqSlider.size(80);
        }

        function draw() {
            background(0);
            let phase = phaseSlider.value();
            let Vfreq = vfreqSlider.value();
            let Hfreq = hfreqSlider.value();

            fill(255);
            textSize(17);
            textAlign(LEFT, CENTER);
            const valOffset = 80;
            text(`phase=${phaseSlider.value()}`, SliderX, phaseSliderY + sliderVoffset / 2);
            text(`vfreq=${vfreqSlider.value()}`, SliderX, vfreqSliderY + sliderVoffset / 2);
            text(`hfreq=${hfreqSlider.value()}`, SliderX, hfreqSliderY + sliderVoffset / 2);

            // Set angle based on frameCount, and display current value

            let angle = frameCount / Math.max(Hfreq, Vfreq) % 360;

            fill(255);
            textSize(20);
            textAlign(LEFT, CENTER);
            text(`angle: ${Math.floor(angle)}`, 25, 25);

            // Draw bounding rectangle
            noFill();
            stroke(128);
            strokeWeight(3);
            drawingContext.setLineDash([1, 3]);
            rect(rectX, rectY, rectW, rectH);
            drawingContext.setLineDash([]);


            // Draw circle and diameters

            noFill();
            stroke('red');
            strokeWeight(2);
            circle(VcircleX, VcircleY, 2 * VcircleRadius);
            line(VcircleX, VcircleY - VcircleRadius, VcircleX, VcircleY + VcircleRadius);
            line(VcircleX - VcircleRadius, VcircleY, VcircleX + VcircleRadius, VcircleY);

            noFill();
            stroke('orange');
            strokeWeight(2);
            circle(HcircleX, HcircleY, 2 * HcircleRadius);
            line(HcircleX, HcircleY - HcircleRadius, HcircleX, HcircleY + HcircleRadius);
            line(HcircleX - HcircleRadius, HcircleY, HcircleX + HcircleRadius, HcircleY);

            // Draw moving points

            // Vertical
            let VpointX = VcircleX + VcircleRadius * cos(Vfreq * angle);
            let VpointY = VcircleY - VcircleRadius * sin(Vfreq * angle);

            stroke(128);
            strokeWeight(3);
            line(VcircleX, VcircleY, VpointX, VpointY);

            noStroke();

            fill('red');
            circle(VpointX, VpointY, 10);

            // Horizontal
            let HpointX = HcircleX + HcircleRadius * cos(Hfreq * angle + phase);
            let HpointY = HcircleY - HcircleRadius * sin(Hfreq * angle + phase);

            stroke(128);
            strokeWeight(3);
            line(HcircleX, HcircleY, HpointX, HpointY);

            noStroke();

            fill('orange');
            circle(HpointX, HpointY, 10);

            // Draw Lissajous curve
            const HY = t => cos(Hfreq * t + phase);
            const VY = t => sin(Vfreq * t);

            noFill();
            stroke(180);
            strokeWeight(2);
            beginShape();
            for (let t = 0; t <= 360; t+=0.5) {
                let x = HcircleX + HcircleRadius * HY(t);
                let y = VcircleY - VcircleRadius * VY(t);
                vertex(x, y);
            }
            endShape();

            // Combined
            noStroke();

            fill('white');
            circle(HpointX, VpointY, 10);

            // Draw graph

            stroke('grey');
            strokeWeight(3);
            line(graphX, graphY, graphX + 300, graphY);
            line(graphX, graphY - graphAmplitude, graphX, graphY + graphAmplitude);
            line(
                graphX + graphPeriod,
                graphY - graphAmplitude,
                graphX + graphPeriod,
                graphY + graphAmplitude
            );

            fill('grey');
            strokeWeight(1);
            textAlign(CENTER, CENTER);
            text('0', graphX, graphY + graphAmplitude + 20);
            text('360', graphX + graphPeriod, graphY + graphAmplitude + 20);
            text('1', graphX / 2, graphY - graphAmplitude);
            text('0', graphX / 2, graphY);
            text('-1', graphX / 2, graphY + graphAmplitude);

            fill('orange');
            text('H', graphX + graphPeriod + graphX / 2, graphY - graphAmplitude);
            fill('red');
            text('V', graphX + graphPeriod + graphX / 2, graphY);
            fill('green');
            text('Combined', graphX + graphPeriod + graphX / 2, graphY + graphAmplitude);

            // Draw horizontal curve

            noFill();
            stroke('orange');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                let y = graphY - graphAmplitude * HY(t);
                vertex(x, y);
            }
            endShape();

            // Draw vertical curve

            noFill();
            stroke('red');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                let y = graphY - graphAmplitude * VY(t) / 2;
                vertex(x, y);
            }
            endShape();

            // Draw combined curve

            noFill();
            stroke('green');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                let y = graphY - graphAmplitude * VY(t) / 2 - graphAmplitude * HY(t);
                vertex(x, y);
            }
            endShape();

            // Draw moving line

            let lineX = map(angle, 0, 360, graphX, graphX + graphPeriod);
            stroke('grey');
            line(lineX, graphY - graphAmplitude, lineX, graphY + graphAmplitude);

            // Draw moving points on graph

            noStroke();

            fill('orange');
            circle(lineX, graphY - graphAmplitude * HY(angle), 10);

            fill('red');
            circle(lineX, graphY - graphAmplitude * VY(angle) / 2, 10);
        }
    </script>
</body>

</html>
